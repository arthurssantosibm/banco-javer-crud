<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Cliente</title>

    <link rel="icon" href="../img/bankjaverlogo.png" type="image/png">
    <link rel="stylesheet" href="../css/style_register.css">
</head>
<body>

<div class="form-container">
    <h1>Cadastro de Novo Correntista</h1>

    <form id="cadastroForm" novalidate>

        <div class="form-group">
            <label for="nome">Nome Completo</label>
            <input
                type="text"
                id="nome"
                name="nome"
                required
                minlength="3"
            >

            <span id="nomeError" class="error-message"></span>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                required
            >
            <span id="emailError" class="error-message"></span>
        </div>

        <div class="form-group">
            <label for="telefone">Telefone</label>
            <input
                type="tel"
                id="telefone"
                name="telefone"
                required
                pattern="[0-9]{10,11}"
            >
            <span id="telefoneError" class="error-message"></span>
        </div>
 
        <section>
            <div class="form-group">
                <label for="senha">Senha</label>
                
                <div class="input-icon-container">
                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        required
                        minlength="6"
                    >
                    <div id="icons"></div> 
                </div>
                
                <span id="senhaError" class="error-message"></span>
            </div>
        </section>

        <button type="submit" id="submitButton">Cadastrar Cliente</button>
        <div class="login">
            <p>Já tem uma conta? <a href="login.html">Faça login</a></p>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../js/register.js"></script>
</body>
</html>
