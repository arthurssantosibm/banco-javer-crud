<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BankJaver - Seu Dashboard Financeiro</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" href="../img/bankjaverlogo.png" type="image/png">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body>

    <aside class="sidebar">
        <div class="user-info">
            <span class="material-icons">account_circle</span>
            <h3 id="client-name">Olá</h3>
        </div>

        <nav class="sidebar-nav">
            <a href="#" class="nav-item active">
                <span class="material-icons">home</span> Dashboard
            </a>
            <a href="settings.html" class="nav-item">
                <span class="material-icons">settings</span> Configurações
            </a>
            <a href="extrato.html" class="nav-item">
                <span class="material-icons">payments</span> Transferências
            </a>
            <a href="login.html" class="nav-item logout" id="logout-btn">
                <span class="material-icons">logout</span> Sair
            </a>
        </nav>
    </aside>

    <main class="main-content">

        <header class="header">
            <a href="home.html"><img src="../img/bankjaverlogo.png" alt="Logo BankFlow" class="logo-img"></a>
            <a href="home.html">
                <div class="bank-logo">Bank<span class="highlight">Javer</span></div>
            </a>
            <div class="header-actions">
                <button class="icon-button" id="theme-toggle"><span class="material-icons">contrast</span></button>
                <button class="icon-button"><span class="material-icons">notifications</span></button>
                <button class="icon-button"><span class="material-icons">help</span></button>

            </div>
        </header>

        <section class="dashboard-grid">

            <div class="card balance-card animate-in">
                <div class="card-icon">
                    <span class="material-icons">attach_money</span>
                </div>
                <h2 class="card-title">Saldo Disponível</h2>
                <p class="card-value" id="current-balance">R$ --</p>
                <a href="extrato.html"><button class="view-statement-btn">Transferir</button></a>
            </div>

            <div class="card score-card animate-in delay-1">
                <div class="card-icon">
                    <span class="material-icons" id="credit-score-display">credit_score</span>
                </div>
                <h2 class="card-title">Score de Crédito</h2>
                

                <div class="gauge-container">
                    <canvas id="credit-score-chart"></canvas>
                    <span class="score-points" id="score-points-display">-- Pontos</span>
                    <span class="score-percentage" id="score-percentage-display"></span>
                    
                </div>
            </div>

            <div class="card latest-transactions-card animate-in delay-2">
                <h2 class="card-title">Histórico de Transações</h2>
                <ul class="transaction-list" id="transaction-list">
                    <li>Carregando...</li>
                </ul>
            </div>

        </section>

    </main>

    <!-- Script da aplicação -->
    <script src="../js/script.js" defer></script>

</body>

</html>
