<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="icon" href="../img/bankjaverlogo.png" type="image/png">
    <link rel="stylesheet" href="../css/style_login.css">
</head>
<body>

<div class="form-container">
    <h1>Login</h1>

    <form id="loginForm" novalidate>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" required>
        </div>

        <div class="form-group">
            <label for="senha">Senha</label>
            <input type="password" id="senha" required minlength="6">
        </div>

        <button type="submit" id="loginButton" onClick="login()">Entrar</button>
        <div class="error" id="error"></div>
        <div class="cad">
            <p>Ainda não tem uma conta? <a href="register.html">Cadastre-se</a></p>
        </div>
        
    </form>
</div>

<script src="../js/login.js"></script>
</body>
</html>
